name: Windows desktop build
on:
  push:
    branches: [main, 'development/**', 'feature/native-multiplayer-ui']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:integration
      - name: Native UI regression (simulated transport)
        run: npm run test:browser
        env:
          SIMULATE_WEBRTC: '1'
      - name: Native UI with real local WebRTC
        run: npm run test:browser
      - run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke test packaged application
        run: node tests/desktop-smoke.cjs dist/win-unpacked/Gwent\ Classic\ Online.exe
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: Gwent-Classic-Online-Windows-x64
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 30
